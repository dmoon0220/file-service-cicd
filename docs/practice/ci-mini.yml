#
# 이름 : ci.yml
# 용도 : push와 PR마다 테스트를 자동 실행함
# 대상 : main 브랜치

name: ci

# TODO [1-1] main으로 가는 push와 main으로 가는 PR 두 가지에서 실행되도록 on 블록을 작성합니다.
on:  #언제 실행할지
  push: #메인 브런치
    branches: [main]
  pull_request:  #다른 브런치에서 풀요청이
    branches: [main]
jobs: #워크플로에서 실행할 작업
  test: #작업은 식별자 테스트작업하나를 정의
    # TODO [1-2] 러너를 ubuntu-24.04로 지정하고, 매달린 잡을 막기 위해 제한 시간 15분을 둡니다.
    runs-on: ubuntu-24.04 #작업실행환경
    timeout-minutes: 15 #최대실행시간  테스트가 멈추가나 작업이 지나치게오래를방지

    steps: #실행단계목록
    # TODO [1-3] 저장소 코드를 러너로 받아 옵니다.
      - uses: actions/checkout@v7 #코드를 러너로받아옴
    # TODO [1-4] JDK 21을 설치합니다. 배포판은 temurin입니다.
      - uses: actions/setup-java@v6  #개발환경준비
        with:
          distribution: temurin
          java-version: '21'
    # TODO [1-5] gradlew에 실행 권한을 주고 테스트를 실행합니다.
      - name: 테스트   #gradle테스트 진행
        run: |
          chmod +x gradlew
          ./gradlew test
    # TODO [1-6] 테스트가 실패했을 때만 테스트 보고서를 아티팩트로 올립니다.
    #            보고서 경로는 build/reports/tests/test 이고, 보관 기간은 7일입니다.
      - name: 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7